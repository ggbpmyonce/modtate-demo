<style>
  /* English → Roboto, Chinese stays Noto Sans TC */
  :root { --font-sans: 'Roboto', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { -webkit-font-smoothing: antialiased; font-family: var(--font-sans); background: var(--surface-page); color: var(--text-primary); }
  :root { --mta-gold: #D4B36A; }
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
  button { font-family: var(--font-sans); }
  h1, h2, h3 { letter-spacing: -0.3px; }

  #mta-sidebar-wrap { position: sticky; top: 0; height: 100vh; }
  #mta-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 150; }

  @media (max-width: 880px) {
    #mta-grid { grid-template-columns: 1fr !important; }
    #mta-sidebar-wrap {
      position: fixed !important; left: 0; top: 0; bottom: 0; width: 256px; z-index: 200;
      transform: translateX(-100%); transition: transform 220ms ease;
      box-shadow: 4px 0 20px rgba(0,0,0,0.12);
    }
    #mta-sidebar-wrap.mob-open { transform: translateX(0); }
    #mta-overlay.mob-open { display: block; }
    #mta-kpi { grid-template-columns: repeat(2,1fr) !important; }
    #mta-detail-grid { grid-template-columns: 1fr !important; }
    #mta-login { grid-template-columns: 1fr !important; }
    #mta-login-brand { display: none !important; }
  }
  @media (min-width: 881px) { #mta-burger { display: none !important; } }
  @keyframes mtaToastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @media (max-width: 560px) {
    #mta-kpi { grid-template-columns: 1fr !important; }
    .mta-form-2col, .mta-form-3col { grid-template-columns: 1fr !important; }
    .mta-detail-gallery { grid-template-columns: 1fr 1fr !important; grid-template-rows: auto !important; height: auto !important; }
    .mta-detail-gallery > :first-child { grid-row: auto !important; }
  }
</style>
